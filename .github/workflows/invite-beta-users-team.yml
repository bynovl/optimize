name: Invite Beta Members (Team)
on:
  workflow_dispatch:  # Manual trigger from Actions tab
  # schedule: # Disabled for now, can be re-enabled as needed
  # - cron: '0 */4 * * *'  # Run every 4 hours
  repository_dispatch:
    types: [new-beta-signup]  # Webhook trigger (optional)

jobs:
  invite-users:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ORG: bynovl
      TEAM_SLUG: ${{ secrets.GH_BETA_TEAM }} # e.g. beta-users
      GH_TOKEN: ${{ secrets.GHA_TOKEN }}
    steps:
      # - name: Fetch Form Submissions
      #   id: fetch
      #   env:
      #     FB_ID: ${{ secrets.FB_ID }}
      #     FB_API_KEY: ${{ secrets.FB_API_KEY }}
      #   run: |
      #     echo "🔄 Fetching submissions from Form Basin..."
      #     curl -sS -L -X GET "https://usebasin.com/api/v1/submissions?filter_by=All&form_id=${FB_ID}&query=&api_token=${FB_API_KEY}" \
      #     -H "Content-Type: application/json" > submissions.json
      #     
      #     # Check if we got data
      #     if ! jq empty submissions.json 2>/dev/null; then            
      #       echo "❌ Invalid JSON response from Form Basin"
      #       exit 1
      #     fi
      #     
      #     SUBMISSION_COUNT=$(jq '.submissions | length' submissions.json)
      #     echo "✅ Found $SUBMISSION_COUNT submissions"


      - name: Generate test submissions (testing only)
        run: |
          echo "🧪 Using hardcoded test submissions..."
          cat <<'EOF' > submissions.json
          {
            "submissions": [
              {
                "payload_params": {
                  "username": "sydharris",
                  "email": "syd@bynovl.com"
                }
              }
            ]
          }
          EOF
          SUBMISSION_COUNT=$(jq '.submissions | length' submissions.json)
          echo "✅ Loaded $SUBMISSION_COUNT test submissions"

      - name: Filter new users for invite/newsletter
        run: |
          echo "🔍 Filtering new users not yet invited..."
          # Extract all team member usernames (normalized, no @)
          gh api orgs/${ORG}/teams/${TEAM_SLUG}/members --paginate --jq '.[].login' > team_members.txt
          # Filter submissions to only those with new usernames
          jq --argfile members team_members.txt '{submissions: [.submissions[] | select((.payload_params.username // empty | ltrimstr("@")) as $u | ($members | index($u) | not))]}' submissions.json > new_users.json
          echo "✅ New users to invite/newsletter: $(jq '.submissions | length' new_users.json)"

      - name: Send newsletter to all new users
        run: |
          echo "📧 Sending newsletter to all new users in new_users.json..."
          socializer --publish welcome.md --force --list=new_users.json
      
      - name: Process and invite new team members
        run: |
          echo "📋 Inviting new GitHub usernames to team..."
          jq -r '.submissions[].payload_params.username // empty | ltrimstr("@")' new_users.json | while read -r github_handle; do
            if [[ -z "$github_handle" ]]; then
              continue
            fi
            echo "➡️ Adding $github_handle to team ${TEAM_SLUG}..."
            if response=$(gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/orgs/${ORG}/teams/${TEAM_SLUG}/memberships/$github_handle" \
              -f role='member' 2>&1); then
              echo "✅ Added $github_handle to team"
            else
              error=$(echo "$response" | jq -r '.message // "Unknown error"' 2>/dev/null || echo "$response")
              echo "⚠️ Skipped $github_handle: $error"
            fi
          done
          echo "✅ Sync complete"
