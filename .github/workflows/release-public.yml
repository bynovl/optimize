name: Release (Public)

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          registry-url: 'https://npm.pkg.github.com/'
      - run: pnpm install
      - name: Configure npm for GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PUBLISH_TOKEN }}" > ~/.npmrc

      - name: Set up Git user
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Version packages
        run: pnpm changeset version

      - name: Commit version bumps
        run: |
          git add .
          git commit -m "chore: version bump [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Publish packages
        id: publish
        run: |
          pnpm changeset publish | tee publish.log
          git fetch --tags
          echo "TAGS=$(git tag --sort=-creatordate | head -n1)" >> $GITHUB_ENV
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PUBLISH_TOKEN }}

      - name: Push tags to origin
        run: |
          git push --follow-tags origin main

      - name: Extract latest changelog entry
        if: env.TAGS != ''
        id: changelog
        run: |
          VERSION=$(node -p "require('./packages/optimize-core/package.json').version")
          awk "/^##? v?$VERSION/,/^##? v?/{if (!x++) print; else exit}" packages/optimize-core/CHANGELOG.md > RELEASE_CHANGELOG.md
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          cat RELEASE_CHANGELOG.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        if: env.TAGS != ''
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.TAGS }}
          release_name: Release ${{ env.TAGS }}
          body: ${{ env.RELEASE_NOTES }}
          draft: false
          prerelease: false

# Manage public package releases with Githhub