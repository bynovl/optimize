name: Release (Public)

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v3
        with:
          node-version: 22           
          registry-url: 'https://npm.pkg.github.com/'

      - run: pnpm install

      - name: Configure npm for GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PUBLISH_TOKEN }}" > ~/.npmrc

      - name: Set up Git user
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Version packages
        run: pnpm changeset version

      # -------------------------------------------------
      #  Commit version bumps – **no pull before commit**
      # -------------------------------------------------
      - name: Commit version bumps
        id: commit_version
        run: |
          # The version‑bump files are already present in the working tree.
          # Adding, committing and pushing them is enough – pulling would
          # try to merge remote changes *over* these un‑committed files and
          # abort with “local changes would be overwritten”.
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: version bump [skip ci]"
            git push origin main
            echo "committed=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish packages
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PUBLISH_TOKEN }}

      - name: Tag core version and push
        if: steps.commit_version.outputs.committed == 'true'
        run: |
          CORE_PKG=packages/optimize-core/package.json
          VERSION=$(jq -r .version "$CORE_PKG")
          TAG="core@$VERSION-beta"
          # Only create tag if it doesn't exist
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          else
            echo "Tag $TAG already exists. Skipping."
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PUBLISH_TOKEN }}
