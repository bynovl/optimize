name: Invite Beta Members
on:
  workflow_dispatch:  # Manual trigger from Actions tab
  # schedule: # Disabled for now, can be re-enabled as needed
  # - cron: '0 */4 * * *'  # Run every 4 hours
  repository_dispatch:
    types: [new-beta-signup]  # Webhook trigger (optional)

jobs:
  invite-users:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GHA_TOKEN }}
      FB_ID: ${{ secrets.FB_ID }}
      FB_API_KEY: ${{ secrets.FB_API_KEY }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_REGISTRY: ${{ secrets.NPM_REGISTRY }}
      PRIV_PACKAGES: ${{ secrets.PRIV_PACKAGES }}
      EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
      EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      EMAIL_UNSUBSCRIBE: ${{ secrets.EMAIL_UNSUBSCRIBE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install pnpm
        run: npm install -g pnpm
        shell: bash

      - name: Install package dependencies
        run: |
          echo "@bynovl:registry=https://${NPM_REGISTRY}/" > .npmrc
          echo "//${NPM_REGISTRY}/:_authToken=${NPM_TOKEN}" >> .npmrc
          pnpm install ${PRIV_PACKAGES}
          rm .npmrc
        working-directory: ${{ github.workspace }}
        
      - name: Fetch Form Submissions
        id: fetch       
        run: |
          echo "🔄 Fetching submissions from Form Basin..."
          curl -sS -L -X GET "https://usebasin.com/api/v1/submissions?filter_by=All&form_id=${FB_ID}&query=&api_token=${FB_API_KEY}" \
          -H "Content-Type: application/json" > submissions.json
          
          # Check if we got data
          if ! jq empty submissions.json 2>/dev/null; then            
            echo "❌ Invalid JSON response from Form Basin"
            exit 1
          fi
          
          SUBMISSION_COUNT=$(jq '.submissions | length' submissions.json)
          echo "✅ Found $SUBMISSION_COUNT submissions"

      - name: Filter new users for invite/newsletter
        run: |
          echo "🔍 Filtering new users not yet invited..."
          gh api repos/${{ github.repository }}/collaborators --paginate --jq '.[].login' | jq -R . | jq -s . > collaborators.json
          jq --slurpfile collaborators collaborators.json '{submissions: [.submissions[] | select((.payload_params.username // empty | ltrimstr("@")) as $u | ($collaborators[0] | index($u) | not))]}' submissions.json > new_users.json
          echo "✅ New users to invite/newsletter: $(jq '.submissions | length' new_users.json)"

      - name: Send invites to new users
        run: |
          echo "📧 Sending newsletter to all new users in new_users.json..."
          pnpm exec socializer --posts-dir=.github/templates --publish invite.md --force --list=new_users.json
          
      - name: Process and invite new collaborators
        run: |
          echo "📋 Inviting new GitHub usernames..."
          jq -r '.submissions[].payload_params.username // empty | ltrimstr("@")' new_users.json | while read -r github_handle; do
            if [[ -z "$github_handle" ]]; then
              continue
            fi
            echo "➡️ Inviting by username: $github_handle"
            if response=$(gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${{ github.repository }}/collaborators/$github_handle" \
              -f permission='pull' 2>&1); then
              echo "✅ Invited $github_handle"
            else
              error=$(echo "$response" | jq -r '.message // "Unknown error"' 2>/dev/null || echo "$response")
              echo "⚠️ Skipped $github_handle: $error"
            fi
          done
          echo "✅ Sync complete"

