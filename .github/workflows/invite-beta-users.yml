name: Invite Beta Members
on:
  workflow_dispatch:  # Manual trigger from Actions tab
  # schedule: # Disabled for now, can be re-enabled as needed
  # - cron: '0 */4 * * *'  # Run every 4 hours
  repository_dispatch:
    types: [new-beta-signup]  # Webhook trigger (optional)

jobs:
  invite-users:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GHA_TOKEN }}
      FB_ID: ${{ secrets.FB_ID }}
      FB_API_KEY: ${{ secrets.FB_API_KEY }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_REGISTRY: ${{ secrets.NPM_REGISTRY }}
      PRIV_PACKAGES: ${{ secrets.PRIV_PACKAGES }}
      EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
      EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      EMAIL_UNSUBSCRIBE: ${{ secrets.EMAIL_UNSUBSCRIBE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install pnpm
        run: npm install -g pnpm
        shell: bash

      - name: Install package dependencies
        run: |
          echo "@bynovl:registry=https://${NPM_REGISTRY}/" > .npmrc
          echo "//${NPM_REGISTRY}/:_authToken=${NPM_TOKEN}" >> .npmrc
          pnpm install ${PRIV_PACKAGES}
          rm .npmrc
        working-directory: ${{ github.workspace }}
        
      - name: Fetch Form Submissions
        id: fetch       
        run: |
          echo "🔄 Fetching submissions from Form Basin..."
          curl -sS -L -X GET "https://usebasin.com/api/v1/submissions?filter_by=All&form_id=${FB_ID}&query=&api_token=${FB_API_KEY}" \
          -H "Content-Type: application/json" > submissions.json
          
          # Check if we got data
          if ! jq empty submissions.json 2>/dev/null; then            
            echo "❌ Invalid JSON response from Form Basin"
            exit 1
          fi
          
          SUBMISSION_COUNT=$(jq '.submissions | length' submissions.json)
          echo "✅ Found $SUBMISSION_COUNT submissions"

      - name: Classify users by invite status
        run: |
          echo "🔍 Fetching current collaborators..."
          gh api repos/${{ github.repository }}/collaborators --paginate --jq '.[].login | ascii_downcase' | jq -R . | jq -s 'unique' > collaborators.json
          echo "🔍 Fetching repository invitations..."
          gh api repos/${{ github.repository }}/invitations --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" > invitations.json
          jq '[.[] | select(.expired == false and (.invitee.login? != null)) | .invitee.login | ascii_downcase] | unique' invitations.json > pending.json
          jq '[.[] | select(.expired == true and (.invitee.login? != null)) | { invitation_id: .id, login: (.invitee.login | ascii_downcase) }] | unique_by(.login)' invitations.json > expired_invites.json
          jq '[.[].login] | unique' expired_invites.json > expired.json
          jq --slurpfile expired expired.json '{submissions: [.submissions[] | select((.payload_params.username // empty | ltrimstr("@") | ascii_downcase) as $u | $u != "" and ($expired[0] | index($u)))]}' submissions.json > expired_users.json
          jq --slurpfile collaborators collaborators.json --slurpfile pending pending.json --slurpfile expired expired.json '{submissions: [.submissions[] | select((.payload_params.username // empty | ltrimstr("@") | ascii_downcase) as $u | $u != "" and ($collaborators[0] | index($u) | not) and ($pending[0] | index($u) | not) and ($expired[0] | index($u) | not))]}' submissions.json > new_users.json
          echo "✅ Pending invites: $(jq 'length' pending.json)"
          echo "✅ Expired invites: $(jq 'length' expired_invites.json)"
          echo "✅ New users to invite/newsletter: $(jq '.submissions | length' new_users.json)"

      - name: Show classified invite JSON
        run: |
          echo "===== pending.json ====="
          jq '.' pending.json
          echo "===== expired.json ====="
          jq '.' expired.json
          echo "===== new_users.json ====="
          jq '.' new_users.json
          
