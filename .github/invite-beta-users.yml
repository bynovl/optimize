name: Invite Beta Users from Form Basin

on:
  workflow_dispatch:  # Manual trigger from Actions tab
  schedule:
    - cron: '0 */4 * * *'  # Run every 4 hours
  repository_dispatch:
    types: [new-beta-signup]  # Webhook trigger (optional)

jobs:
  invite-users:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      administration: write  # Needed to invite collaborators
    
    steps:
      - name: Fetch Form Basin submissions
        id: fetch
        run: |
          echo "🔄 Fetching submissions from Form Basin..."
          curl -s -H "Authorization: Bearer ${{ secrets.FB_API_KEY }}" \
            "https://usebasin.com/api/v1/submissions?form_id=${{ secrets.FB_ID }}" \
            > submissions.json
          
          # Check if we got data
          if ! jq empty submissions.json 2>/dev/null; then
            echo "❌ Invalid JSON response from Form Basin"
            exit 1
          fi
          
          SUBMISSION_COUNT=$(jq 'length' submissions.json)
          echo "✅ Found $SUBMISSION_COUNT submissions"
      
      - name: Process and invite collaborators
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "📋 Processing GitHub handles..."
          
          # Create state file to track processed submissions
          touch processed.txt
          
          # Extract GitHub handles from submissions
          jq -r '.[] | "\(.id)|\(.github_handle // .github_username // .github // empty)"' submissions.json | while IFS='|' read -r submission_id github_handle; do
            
            # Skip if already processed
            if grep -q "^$submission_id$" processed.txt 2>/dev/null; then
              echo "⏭️  Submission $submission_id already processed, skipping"
              continue
            fi
            
            # Skip if no GitHub handle
            if [[ -z "$github_handle" ]]; then
              echo "⚠️  Submission $submission_id has no GitHub handle, skipping"
              continue
            fi
            
            echo "➕ Inviting $github_handle to ${{ github.repository }}..."
            
            # Invite collaborator using GitHub CLI
            if gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${{ github.repository }}/collaborators/$github_handle" \
              -f permission='pull' 2>&1; then
              
              echo "✅ Successfully invited $github_handle"
              echo "$submission_id" >> processed.txt
            else
              echo "❌ Failed to invite $github_handle"
            fi
            
          done
          
          echo "✅ Sync complete"
      
      - name: Upload state file
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: processed-submissions
          path: processed.txt
          retention-days: 90
