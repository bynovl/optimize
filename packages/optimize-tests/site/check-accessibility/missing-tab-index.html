<!DOCTYPE html>
<html lang="en">

<head>
  <title>Tabindex Warning Example</title>
  <meta name="description" content="This page is used to test missing tabindex accessibility issues.">
  <meta name="keywords" content="accessibility, tabindex, test">
  <link rel="canonical" href="/page.html">
  <!--  Open Graph -->
  <meta property="og:title" content="Open Graph Title">
  <meta property="og:description" content="A valid Open Graph description.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="/check-links/no-text.html">
  <meta property="og:image" content="../assets/images/banner.png">
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Valid Twitter Title">
  <meta name="twitter:description" content="A valid Twitter description for the page.">
  <meta name="twitter:image" content="/assets/images/banner.png">
</head>

<body>
  <h1>Check Accessibility</h1>
  <div tabindex="5">Tabindex set to 5</div>
  <button tabindex="0">Button</button>
  <a href="#" tabindex="-1">Link not focusable</a>
  <!-- Schema.org JSON-LD -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Valid Page Title",
      "description": "This is a valid meta description for the page.",
      "author": {
        "@type": "Person",
        "name": "Jane Doe"
      }
    }
  </script>
</body>

</html>
