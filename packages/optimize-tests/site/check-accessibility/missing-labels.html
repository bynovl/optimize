<!DOCTYPE html>
<html lang="">

<head>
  <title>Missing Label</title>
  <meta name="description" content="This is a valid meta description.">
  <meta name="keywords" content="meta, test, valid">
  <link rel="canonical" href="/page.html">
  <!--  Open Graph -->
  <meta property="og:title" content="Open Graph Title">
  <meta property="og:description" content="A valid Open Graph description.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="/check-meta/index.html">
  <meta property="og:image" content="../assets/images/banner.png">
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Valid Twitter Title">
  <meta name="twitter:description" content="A valid Twitter description for the page.">
  <meta name="twitter:image" content="/assets/images/banner.png">
</head>

<body>
  <h1>Check Accessibility</h1>
  <form>
    <input type="text" id="username">
    <!-- Missing label for username -->
    <label for="password">Password</label>
    <input type="password" id="password">
  </form>
  <!-- Schema.org JSON-LD -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Valid Page Title",
      "description": "This is a valid meta description for the page.",
      "author": {
        "@type": "Person",
        "name": "Jane Doe"
      }
    }
  </script>
</body>

</html>
