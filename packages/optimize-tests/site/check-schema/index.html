<!DOCTYPE html>
<html lang="en">

<head>
  <title>Valid Schema Example</title>
  <meta name="description" content="Meta description present." />
  <meta name="keywords" content="meta, test" />
  <link rel="canonical" href="https://example.com/" />
  <!-- Open Graph -->
  <meta property="og:title" content="Valid Open Graph Title">
  <meta property="og:description" content="A valid Open Graph description for the page.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="/page.html">
  <meta property="og:image" content="/assets/images/banner.png">
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Valid Twitter Title">
  <meta name="twitter:description" content="A valid Twitter description for the page.">
  <meta name="twitter:image" content="/assets/images/banner.png">

</head>

<body>
  <h1>Schema Test</h1>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "name": "Check Schema",
      "mainEntity": {
        "@type": "Question",
        "name": "What is schema testing?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Schema testing ensures required fields are present and valid."
        }
      }
    }
  </script>
</body>

</html>
