<!DOCTYPE html>
<html lang="en">

<head>
  <title>Valid Media Example</title>
  <meta name="description" content="This is a valid meta description for the page.">
  <meta name="keywords" content="valid, meta, open graph, schema, test">
  <link rel="canonical" href="/page.html">

  <!-- Open Graph -->
  <meta property="og:title" content="Valid Open Graph Title">
  <meta property="og:description" content="A valid Open Graph description for the page.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="/page.html">
  <meta property="og:image" content="/assets/images/banner.png">


  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Valid Twitter Title">
  <meta name="twitter:description" content="A valid Twitter description for the page.">
  <meta name="twitter:image" content="/assets/images/banner.png">
</head>

<body>
  <style>
    .banner {
      background-image: url('../assets/images/banner.png');
      width: 100%;
      height: 200px;
    }
  </style>
  <h1>Check Media</h1>
  <div class="banner"></div>
  <div style="background-image: url('/assets/images/banner.png'); width: 100px; height: 100px;"></div>

  <!-- <embed> tests -->
  <embed>
  <embed src="">
  <embed src="/assets/audio/valid.mp3">
  <embed src="/assets/audio/notfound.mp3">
  <embed src="data:audio/mp3;base64,AAAA">

  <!-- <video> tests -->
  <video src="/assets/video/valid.mp4"></video>
  <video src="/assets/video/notfound.mp4"></video>
  <video src=""></video>

  <!-- <audio> tests -->
  <audio src="/assets/audio/valid.mp3"></audio>
  <audio src="/assets/audio/notfound.mp3"></audio>
  <audio src=""></audio>

  <!-- <img> tests -->
  <img src="/assets/images/banner.png" alt="desc">
  <img src="/assets/images/notfound.png" alt="desc">
  <img src="" alt="desc">

  <!-- <picture> tests -->
  <picture>
    <source srcset="/assets/images/banner.webp" type="image/webp">
    <img src="/assets/images/banner.png" alt="desc">
  </picture>
  <picture>
    <source srcset="/assets/images/banner.webp" type="image/webp">
    <source srcset="/assets/images/banner.png" type="image/png">
    <img src="/assets/images/banner.png" alt="desc">
  </picture>
  <!-- Schema.org JSON-LD -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Valid Page Title",
      "description": "This is a valid meta description for the page.",
      "author": {
        "@type": "Person",
        "name": "Jane Doe"
      }
    }
  </script>
</body>

</html>
