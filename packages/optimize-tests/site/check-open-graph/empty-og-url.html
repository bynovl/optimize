<!DOCTYPE html>
<html lang="en">

<head>
  <title>Valid Open Graph Example</title>
  <meta name="description" content="Meta description present.">
  <meta name="keywords" content="meta, test">
  <link rel="canonical" href="https://example.com/">
  <meta property="og:title" content="Valid Title">
  <meta property="og:description" content="Valid Description">
  <meta property="og:image" content="/assets/images/banner.png">
  <meta property="og:url" content="">
  <meta name="twitter:title" content="Valid Twitter Title">
  <meta name="twitter:description" content="Valid Twitter Description">
  <meta name="twitter:image" content="/assets/images/banner.png">
</head>

<body>
  <h1>Empty og:url Test</h1>
  <!-- Schema.org JSON-LD -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Valid Page Title",
      "description": "This is a valid meta description for the page.",
      "author": {
        "@type": "Person",
        "name": "Jane Doe"
      }
    }
  </script>
</body>

</html>
